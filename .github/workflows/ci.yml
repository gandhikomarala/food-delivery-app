name: Enterprise Food Delivery CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  core-test-suite:
    name: Backend Microservices & Quality Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pydantic pydantic-settings fastapi uvicorn sqlalchemy redis python-jose passlib bcrypt cryptography scipy numpy pandas

      - name: Run Core Domain Tests
        env:
          PYTHONPATH: .
        run: |
          pytest tests/unit/auth_security tests/unit/order_lifecycle tests/unit/hyperlocal_dispatch -v

      - name: Verify 100K+ LOC Audit
        run: |
          python scripts/audit_loc.py
